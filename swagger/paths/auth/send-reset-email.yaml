tags:
  - Auth
summary: Send password reset email
operationId: sendResetEmail
description: Sends a password reset link to the provided email
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
        properties:
          email:
            type: string
            format: email
            example: john@example.com
responses:
  '200':
    description: Reset email successfully sent
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Reset password email has been successfully sent.
            data:
              type: object
              example: {}
  '404':
    description: User with this email not found
