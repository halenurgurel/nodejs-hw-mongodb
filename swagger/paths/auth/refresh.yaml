tags:
  - Auth
summary: Refresh user session
operationId: refreshUserSession
description: Refreshes the session using refreshToken and sessionId from cookies
security: []
responses:
  '200':
    description: Successfully refreshed session
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully refreshed a session!
            data:
              type: object
              properties:
                accessToken:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
  '401':
    description: Session not found or expired
