tags:
  - Contacts
summary: Get all Contacts
operationId: getAllContacts
description: Returns a paginated list of contacts for the authenticated user
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    schema:
      type: integer
      default: 1
    description: Page number
  - name: perPage
    in: query
    schema:
      type: integer
      default: 10
    description: Number of contacts per page
  - name: sortBy
    in: query
    schema:
      type: string
      enum:
        [
          _id,
          name,
          email,
          phoneNumber,
          contactType,
          isFavourite,
          createdAt,
          updatedAt,
        ]
      default: _id
    description: Field to sort by
  - name: sortOrder
    in: query
    schema:
      type: string
      enum: [asc, desc]
      default: asc
    description: Sort direction
  - name: type
    in: query
    schema:
      type: string
      enum: [work, home, personal]
    description: Filter by contact type
  - name: isFavourite
    in: query
    schema:
      type: boolean
    description: Filter by favourite status
responses:
  '200':
    description: Successfully found Contacts
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../components/schemas/contact.yaml'
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 10
                totalItems:
                  type: integer
                  example: 42
                totalPages:
                  type: integer
                  example: 5
                hasPreviousPage:
                  type: boolean
                  example: false
                hasNextPage:
                  type: boolean
                  example: true
  '401':
    description: Unauthorized - missing or invalid token
